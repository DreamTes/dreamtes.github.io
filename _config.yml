# Site Settings
locale: "zh-CN"
site_theme: "default" # "default", "air", "sunrise", "mint", "dirt", "contrast"
title: "DreamTes"
title_separator: "-"
name: "DreamTes"
description: "Research, publications, and notes."
url: "https://dreamtes.github.io"
baseurl: ""
repository: "DreamTes/dreamtes.github.io"

# Author Profile
author:
  avatar:
  name: "DreamTes"
  bio: "Researcher"
  location:
  employer:
  email:

  # Academic Links
  googlescholar:
  orcid:
  researchgate:
  arxiv:

  # Social/Dev Links
  github: "DreamTes"
  linkedin:
  twitter:

include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - node_modules
  - package.json
  - Gemfile
  - LICENSE
  - README
  - vendor

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/

# Default Front Matter
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      share: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: false

# Conversion/Processing
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
future: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
