{% include base_path %}
<p>&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}</p>
<nav aria-label="Footer navigation">
  {% if site.author.email and site.author.email != empty %}<a href="mailto:{{ site.author.email }}">Email</a>{% endif %}
  {% if site.author.github and site.author.github != empty %}<a href="https://github.com/{{ site.author.github }}">GitHub</a>{% endif %}
  <a href="{{ base_path }}/sitemap/">Sitemap</a>
</nav>
