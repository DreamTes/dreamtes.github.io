{% include base_path %}
{% assign archive_title = post.title | markdownify | remove: "<p>" | remove: "</p>" %}

<article class="archive-item">
  {% if post.date %}<time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y.%m.%d" }}</time>{% endif %}
  <h2><a href="{{ post.url | prepend: base_path }}">{{ archive_title }}</a></h2>
  {% if post.excerpt %}<p>{{ post.excerpt | markdownify | strip_html | truncate: 180 }}</p>{% endif %}
</article>
